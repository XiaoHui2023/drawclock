[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drawclock"
version = "1.0.0"
description = "从时钟连接配置生成 SVG 时钟图"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["config-library[json5,toml,yaml]==0.18.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "config_input",
    "device_attrs_validate",
    "library_payload",
    "drawio_layout",
    "drawio_library",
    "drawio_ports",
    "layout_validate",
    "layout_preview",
    "auto_layout",
    "elk_layout",
    "validate_config",
    "source_reference",
    "library_ports",
    "internal_kind",
    "visual_geometry",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
