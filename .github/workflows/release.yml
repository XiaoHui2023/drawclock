name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  feedback-reproduction-gate:
    name: Unresolved feedback blocks release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Exhaust boundary-trunk coverage directions
        run: python3 tools/search_boundary_trunk_coverage.py --output .reproduction/receipts/boundary-trunk-coverage --expect clean

      - name: Cover detached public-trunk structures
        run: python3 tools/search_structural_trunk_recurrence.py --producer-root . --output .reproduction/receipts/structural-trunk --expect clean_verified

      - name: Re-run retained historical feedback corpus
        run: python3 tools/run_recursive_reproduction_rounds.py --receipt .reproduction/receipts/recursive-attack.json

      - name: Fresh-generate and quality-gate every public SVG
        run: python3 tools/check_all_svg_quality.py --report .reproduction/receipts/all-svg-quality.json

      - name: Require natural reproduction and verified fixes
        run: python3 tools/check_feedback_reproduction_gate.py --phase release

  build-linux-ubuntu16:
    name: Linux (Ubuntu 16.04, PyInstaller)
    needs: feedback-reproduction-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Pack in Ubuntu 16.04
        run: docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work ubuntu:16.04 bash tools/ci_pack_ubuntu16.sh

      - name: Fix dist permissions
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Run extracted dependency-free frozen examples
        run: |
          mkdir release-smoke
          tar -xzf dist/drawclock-*-linux.tar.gz -C release-smoke
          BINARY="$(find release-smoke -maxdepth 2 -type f -name drawclock -print -quit)"
          test -n "$BINARY"
          python3 tools/run_frozen_example.py "$BINARY"

      - name: Verify frozen SVG with GNOME librsvg
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          PACKAGE_ROOT="$(find release-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$PACKAGE_ROOT"
          python3 tools/run_librsvg_release.py "$PACKAGE_ROOT"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/drawclock-*-linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: Windows (PyInstaller and 60-second regression gate)
    needs: feedback-reproduction-gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Windows executable and archive
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller
          python -m PyInstaller --clean --noconfirm drawclock.spec
          python tools/bundle_release.py
          $archive = Get-ChildItem dist/drawclock-*-windows.zip -File | Select-Object -First 1
          if (-not $archive) { throw "Windows release archive was not produced" }
          python tools/check_release_archive.py $archive.FullName

      - name: Exercise complete frozen public surface
        run: python tools/run_frozen_example.py dist/drawclock.exe

      - name: Enforce real-scale deterministic 60-second render budget
        run: >-
          python tools/verify_frozen_runtime_budget.py
          --binary dist/drawclock.exe
          --library drawio-lib
          --output .reproduction/receipts/windows-frozen-runtime
          --max-render-seconds 60

      - name: Upload Windows release and runtime receipt
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/drawclock-*-windows.zip
            .reproduction/receipts/windows-frozen-runtime/receipt.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [feedback-reproduction-gate, build-linux-ubuntu16, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: python
        run: |
          import os
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          match = re.search(r'(?m)^version\s*=\s*["\']([^"\']+)["\']', text)
          if not match:
              raise SystemExit("missing project version in pyproject.toml")
          version = match.group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release-assets

      - name: Download Windows release artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Delete stale rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.version.outputs.tag }}" --yes || true

      - name: Move rolling tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Rolling release: self-contained Ubuntu 16.04 and Windows PyInstaller bundles from the main commit.
            Each archive contains the executable, component library, concise usage files, and runnable
            examples. Complete source remains available from
            this tag. It does not bundle Node.js, ELK, a browser, or Python runtime dependencies.
            Before publishing, CI extracts the archive and exercises the frozen executable with the
            host PATH isolated for direct SVG generation under arbitrary output suffixes,
            supplied and merged-library rendering, strict JSON input, and large-layout bounds checks.
            The archive surface is checked against an allowlist. GNOME librsvg renders the frozen
            output and verifies that every component remains painted.
            Windows CI also renders the retained real-scale regression twice within a strict 60-second
            per-run budget, requires byte-identical SVGs, runs all SVG quality metrics, and rejects any
            recurrence of the historical premature public-trunk entry symptom.
          files: release-assets/**
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Download and smoke published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir remote-release remote-smoke
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern 'drawclock-*-linux.tar.gz' \
            --dir remote-release
          ASSET="$(find remote-release -maxdepth 1 -type f -name 'drawclock-*-linux.tar.gz' -print -quit)"
          test -n "$ASSET"
          sha256sum "$ASSET"
          tar -xzf "$ASSET" -C remote-smoke
          PACKAGE_ROOT="$(find remote-smoke -mindepth 1 -maxdepth 1 -type d -print -quit)"
          BINARY="$(find "$PACKAGE_ROOT" -maxdepth 1 -type f -name drawclock -print -quit)"
          test -n "$PACKAGE_ROOT"
          test -n "$BINARY"
          python3 tools/run_frozen_example.py "$BINARY"

  verify-published-windows:
    name: Verify published Windows release
    needs: publish-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and exercise public Windows assets
        shell: pwsh
        run: |
          $text = Get-Content pyproject.toml -Raw
          if ($text -notmatch '(?m)^version\s*=\s*["'']([^"'']+)["'']') {
            throw "missing project version in pyproject.toml"
          }
          $version = $Matches[1]
          $tag = "v$version"
          $base = "https://github.com/${{ github.repository }}/releases/download/$tag"
          New-Item -ItemType Directory -Path remote-windows | Out-Null
          $archive = "remote-windows/drawclock-$version-windows.zip"
          $publishedReceipt = "remote-windows/receipt.json"
          curl.exe -fL --retry 3 --retry-delay 2 -o $archive "$base/drawclock-$version-windows.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          curl.exe -fL --retry 3 --retry-delay 2 -o $publishedReceipt "$base/receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_release_archive.py $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $receipt = Get-Content $publishedReceipt -Raw | ConvertFrom-Json
          if ($receipt.status -ne "passed" -or -not $receipt.deterministic) {
            throw "published runtime receipt is not passed and deterministic"
          }
          if ($receipt.runs.Count -ne 2 -or @($receipt.runs | Where-Object status -ne "passed").Count) {
            throw "published runtime receipt does not contain two passed runs"
          }
          if (@($receipt.quality | Where-Object { -not $_.passed -or $_.required_metric_ids.Count -ne 29 -or $_.executed_metric_ids.Count -ne 29 -or $_.failed_metric_ids.Count }).Count) {
            throw "published runtime receipt does not prove the complete quality metric set"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath remote-windows/extracted
          $binary = Get-ChildItem remote-windows/extracted -Recurse -File -Filter drawclock.exe | Select-Object -First 1
          if (-not $binary) { throw "published Windows archive has no executable" }
          python tools/run_frozen_example.py $binary.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_frozen_runtime_budget.py `
            --binary $binary.FullName `
            --library drawio-lib `
            --output remote-windows/runtime-budget `
            --max-render-seconds 60
